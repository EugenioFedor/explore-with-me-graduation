services:
  discovery-server:
    build:
      context: .
      dockerfile: infra/discovery-server/Dockerfile
    ports:
      - "8761:8761"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health || exit 1" ]
      interval: 1s
      timeout: 2s
      retries: 60
      start_period: 10s

  config-server:
    build:
      context: .
      dockerfile: infra/config-server/Dockerfile
    depends_on:
      discovery-server:
        condition: service_healthy
    environment:
      SERVER_PORT: 8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      EUREKA_HOSTNAME: config-server
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- --header='Accept: application/json' http://discovery-server:8761/eureka/apps/CONFIG-SERVER | grep -q '\"status\":\"UP\"' || exit 1"
        ]
      interval: 1s
      timeout: 2s
      retries: 60
      start_period: 10s

  gateway-server:
    build:
      context: .
      dockerfile: infra/gateway-server/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      config-server:
        condition: service_healthy
      event-service:
        condition: service_started
      user-service:
        condition: service_started
      request-service:
        condition: service_started
      comment-service:
        condition: service_started
    environment:
      EUREKA_URL: http://discovery-server:8761/eureka/
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 20

  stats-server:
    build:
      context: .
      dockerfile: stats-service/stats-server/Dockerfile
    ports:
      - "9090:9090"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:9090/actuator/health || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      stats-db:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      SERVER_PORT: 9090
      POSTGRES_HOST: stats-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: stats
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      EUREKA_URL: http://discovery-server:8761/eureka/
      EUREKA_HOSTNAME: stats-server
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888

  user-service:
    build:
      context: .
      dockerfile: core/user-service/Dockerfile
    depends_on:
      user-db:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://user-db:5432/users
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      EUREKA_URL: http://discovery-server:8761/eureka/
      EUREKA_HOSTNAME: user-service

  request-service:
    build:
      context: .
      dockerfile: core/request-service/Dockerfile
    depends_on:
      request-db:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://request-db:5432/requests
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      EUREKA_URL: http://discovery-server:8761/eureka/
      EUREKA_HOSTNAME: request-service

  comment-service:
    build:
      context: .
      dockerfile: core/comment-service/Dockerfile
    depends_on:
      comment-db:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://comment-db:5432/comments
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      EUREKA_URL: http://discovery-server:8761/eureka/
      EUREKA_HOSTNAME: comment-service

  comment-db:
    image: postgres:17
    ports:
      - "6545:5432"
    environment:
      POSTGRES_DB: comments
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - comment-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d comments" ]
      interval: 5s
      timeout: 5s
      retries: 10

  request-db:
    image: postgres:17
    ports:
      - "6544:5432"
    environment:
      POSTGRES_DB: requests
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - request-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d requests" ]
      interval: 5s
      timeout: 5s
      retries: 10

  stats-db:
    image: postgres:17
    ports:
      - "6541:5432"
    environment:
      POSTGRES_DB: stats
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - stats-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d stats" ]
      interval: 5s
      timeout: 5s
      retries: 10

  event-db:
    image: postgres:17
    ports:
      - "6542:5432"
    environment:
      POSTGRES_DB: events
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - event-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d events" ]
      interval: 5s
      timeout: 5s
      retries: 10

  user-db:
    image: postgres:17
    ports:
      - "6543:5432"
    environment:
      POSTGRES_DB: users
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - user-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d users" ]
      interval: 5s
      timeout: 5s
      retries: 10

  event-service:
    build:
      context: .
      dockerfile: core/event-service/Dockerfile
    depends_on:
      event-db:
        condition: service_healthy
      stats-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://event-db:5432/events
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      EUREKA_URL: http://discovery-server:8761/eureka/
      EUREKA_HOSTNAME: event-service

volumes:
  stats-db-data:
  event-db-data:
  user-db-data:
  request-db-data:
  comment-db-data: