services:
  discovery-server:
    build:
      context: .
      dockerfile: infra/discovery-server/Dockerfile
    ports:
    - 8761:8761
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://localhost:8761/actuator/health || exit 1
      interval: 1s
      timeout: 2s
      retries: 60
      start_period: 10s
  config-server:
    build:
      context: .
      dockerfile: infra/config-server/Dockerfile
    depends_on:
      discovery-server:
        condition: service_healthy
    environment:
      SERVER_PORT: 8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      EUREKA_HOSTNAME: config-server
    healthcheck:
      test:
      - CMD-SHELL
      - 'wget -qO- http://localhost:8888/collector/default >/dev/null && wget -qO-
        --header=''Accept: application/json'' http://discovery-server:8761/eureka/apps
        | grep -q ''"name":"CONFIG-SERVER"'''
      interval: 1s
      timeout: 2s
      retries: 60
      start_period: 10s
  gateway-server:
    build:
      context: .
      dockerfile: infra/gateway-server/Dockerfile
    ports:
    - 8080:8080
    depends_on:
      config-server:
        condition: service_healthy
      event-service:
        condition: service_started
      user-service:
        condition: service_started
      request-service:
        condition: service_started
      comment-service:
        condition: service_started
    environment:
      EUREKA_URL: http://discovery-server:8761/eureka/
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://localhost:8080/actuator/health || exit 1
      interval: 5s
      timeout: 5s
      retries: 20
  user-service:
    build:
      context: .
      dockerfile: core/user-service/Dockerfile
    depends_on:
      user-db:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://user-db:5432/users
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      EUREKA_URL: http://discovery-server:8761/eureka/
      EUREKA_HOSTNAME: user-service
  request-service:
    build:
      context: .
      dockerfile: core/request-service/Dockerfile
    depends_on:
      request-db:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      collector:
        condition: service_healthy
      analyzer:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://request-db:5432/requests
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      EUREKA_URL: http://discovery-server:8761/eureka/
      EUREKA_HOSTNAME: request-service
  comment-service:
    build:
      context: .
      dockerfile: core/comment-service/Dockerfile
    depends_on:
      comment-db:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://comment-db:5432/comments
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      EUREKA_URL: http://discovery-server:8761/eureka/
      EUREKA_HOSTNAME: comment-service
  comment-db:
    image: postgres:17
    ports:
    - 6545:5432
    environment:
      POSTGRES_DB: comments
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
    - comment-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres -d comments
      interval: 5s
      timeout: 5s
      retries: 10
  request-db:
    image: postgres:17
    ports:
    - 6544:5432
    environment:
      POSTGRES_DB: requests
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
    - request-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres -d requests
      interval: 5s
      timeout: 5s
      retries: 10
  event-db:
    image: postgres:17
    ports:
    - 6542:5432
    environment:
      POSTGRES_DB: events
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
    - event-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres -d events
      interval: 5s
      timeout: 5s
      retries: 10
  user-db:
    image: postgres:17
    ports:
    - 6543:5432
    environment:
      POSTGRES_DB: users
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
    - user-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres -d users
      interval: 5s
      timeout: 5s
      retries: 10
  event-service:
    build:
      context: .
      dockerfile: core/event-service/Dockerfile
    depends_on:
      event-db:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      collector:
        condition: service_healthy
      analyzer:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://event-db:5432/events
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      EUREKA_URL: http://discovery-server:8761/eureka/
      EUREKA_HOSTNAME: event-service
  kafka:
    image: apache/kafka:3.7.1
    hostname: kafka
    extra_hosts:
      - "kafka:127.0.0.1"
    ports:
    - 9092:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_MS: -1
    volumes:
    - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
      - CMD-SHELL
      - /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list >/dev/null
        2>&1
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s
  kafka-init-topics:
    image: apache/kafka:3.7.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
    - /bin/bash
    - -ec
    command:
    - '/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists
      --topic stats.user-actions.v1 --partitions 1 --replication-factor 1 --config
      retention.ms=-1

      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists
      --topic stats.events-similarity.v1 --partitions 1 --replication-factor 1

      '
  analyzer-db:
    image: postgres:17
    ports:
    - 6541:5432
    environment:
      POSTGRES_DB: analyzer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
    - analyzer-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres -d analyzer
      interval: 5s
      timeout: 5s
      retries: 10
  collector:
    build:
      context: .
      dockerfile: stats-service/collector/Dockerfile
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      kafka-init-topics:
        condition: service_completed_successfully
    environment:
      SERVER_PORT: '8080'
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_URL: http://discovery-server:8761/eureka/
      EUREKA_HOSTNAME: collector
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://localhost:8080/actuator/health || exit 1
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
  aggregator:
    build:
      context: .
      dockerfile: stats-service/aggregator/Dockerfile
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      kafka-init-topics:
        condition: service_completed_successfully
    environment:
      SERVER_PORT: '8080'
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_URL: http://discovery-server:8761/eureka/
      EUREKA_HOSTNAME: aggregator
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://localhost:8080/actuator/health || exit 1
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
  analyzer:
    build:
      context: .
      dockerfile: stats-service/analyzer/Dockerfile
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      kafka-init-topics:
        condition: service_completed_successfully
      analyzer-db:
        condition: service_healthy
    environment:
      SERVER_PORT: '8080'
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_URL: http://discovery-server:8761/eureka/
      EUREKA_HOSTNAME: analyzer
      SPRING_DATASOURCE_URL: jdbc:postgresql://analyzer-db:5432/analyzer
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://localhost:8080/actuator/health || exit 1
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
volumes:
  event-db-data: null
  user-db-data: null
  request-db-data: null
  comment-db-data: null
  kafka-data: null
  analyzer-db-data: null
