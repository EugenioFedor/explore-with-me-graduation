server.port=0
management.endpoints.web.exposure.include=health,info
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
stats.topics.user-actions=stats.user-actions.v1
stats.topics.events-similarity=stats.events-similarity.v1
grpc.server.port=0
spring.kafka.consumer.group-id=analyzer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.LongDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=ru.practicum.ewm.stats.kafka.UserActionDeserializer
spring.kafka.listener.ack-mode=record
spring.kafka.listener.concurrency=1
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:6541/analyzer}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.sql.init.mode=always
stats.recommendations.recent-limit=100
stats.recommendations.neighbors-limit=10
